name: SIFT Workstation Docker

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: "Ubuntu base image version"
        required: true
        default: "24.04"
      sift_version:
        description: "SIFT saltstack release tag, or latest"
        required: true
        default: "latest"
      cast_version:
        description: "Cast release version without leading v"
        required: true
        default: "1.0.42"
      publish_platforms:
        description: "Comma-separated Docker platforms for publish builds"
        required: true
        default: "linux/amd64,linux/arm64"
      test_pipeline:
        description: "Run the native multi-arch publish pipeline (build + smoke test by digest) without publishing any tags"
        type: boolean
        required: true
        default: false
      publish_ghcr:
        description: "Publish image to GitHub Container Registry"
        type: boolean
        required: true
        default: false
      publish_dockerhub:
        description: "Publish image to Docker Hub"
        type: boolean
        required: true
        default: false
      dockerhub_image:
        description: "Docker Hub image name, for example xboarder56/sift-workstation"
        required: false
        default: "xboarder56/sift-workstation"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  BASE_IMAGE: ubuntu:${{ github.event.inputs.ubuntu_version || '24.04' }}
  SIFT_VERSION: ${{ github.event.inputs.sift_version || 'latest' }}
  CAST_VERSION: ${{ github.event.inputs.cast_version || '1.0.42' }}

jobs:
  validate-amd64:
    name: Build and validate amd64 (server + desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    if: ${{ !(github.event_name == 'workflow_dispatch' && (github.event.inputs.publish_ghcr == 'true' || github.event.inputs.publish_dockerhub == 'true' || github.event.inputs.test_pipeline == 'true')) }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Authenticated pulls avoid Docker Hub's anonymous rate limit. Secrets
      # are unavailable to PRs from forks, which then pull anonymously.
      - name: Log in to Docker Hub for pulls
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No setup-buildx: the default docker driver builds straight into the
      # local image store, so both variants share layers and nothing large
      # has to be exported/loaded.
      - name: Build server and desktop images
        shell: bash
        run: |
          set -euo pipefail
          for target in server desktop; do
            TARGET="$target" IMAGE_TAG="ci-$target" PROGRESS=plain \
            BASE_IMAGE="${BASE_IMAGE}" SIFT_VERSION="${SIFT_VERSION}" CAST_VERSION="${CAST_VERSION}" \
            GIT_COMMIT="${GITHUB_SHA}" IMAGE_VERSION=ci RUN_VALIDATION=true LOAD=false \
              ./scripts/build.sh
          done
          docker image ls sift-workstation

      - name: Validate image contract
        run: |
          for target in server desktop; do
            docker run --rm -e SIFT_VALIDATE_IMAGE_STATE=true "sift-workstation:ci-$target" \
              /opt/dfir/validation/validate-container.sh
          done

      - name: Smoke test server (SSH)
        run: ./scripts/smoke-test.sh sift-workstation:ci-server server

      - name: Smoke test desktop (SSH + RDP)
        env:
          SMOKE_OUT_DIR: ${{ runner.temp }}/smoke
        run: ./scripts/smoke-test.sh sift-workstation:ci-desktop desktop

      - name: Upload RDP screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rdp-screenshot-amd64
          path: ${{ runner.temp }}/smoke/*.png
          if-no-files-found: ignore
          retention-days: 14

  resolve:
    name: Resolve SIFT version
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.publish_ghcr == 'true' || github.event.inputs.publish_dockerhub == 'true' || github.event.inputs.test_pipeline == 'true')
    outputs:
      sift_version: ${{ steps.resolve.outputs.sift_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve SIFT version
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${SIFT_VERSION}" == "latest" ]]; then
            resolved="$(./scripts/latest-sift-version.sh)"
            echo "Resolved SIFT_VERSION=latest -> ${resolved}"
          else
            resolved="${SIFT_VERSION}"
            echo "Using explicit SIFT_VERSION=${resolved}"
          fi
          echo "sift_version=${resolved}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish multi-arch images
    needs: resolve
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      packages: write
    with:
      sift_version: ${{ needs.resolve.outputs.sift_version }}
      cast_version: ${{ github.event.inputs.cast_version || '1.0.42' }}
      ubuntu_version: ${{ github.event.inputs.ubuntu_version || '24.04' }}
      platforms: ${{ github.event.inputs.publish_platforms || 'linux/amd64,linux/arm64' }}
      publish_ghcr: ${{ github.event.inputs.publish_ghcr == 'true' }}
      publish_dockerhub: ${{ github.event.inputs.publish_dockerhub == 'true' }}
      # Only the newest upstream release moves the floating latest/desktop tags.
      move_latest: ${{ (github.event.inputs.sift_version || 'latest') == 'latest' }}
      dockerhub_image: ${{ github.event.inputs.dockerhub_image || 'xboarder56/sift-workstation' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
